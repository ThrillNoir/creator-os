name: Verify

on:
  pull_request:
    branches:
      - main

# Pull-request verification is intentionally read-only. It has no deploy, Cloudflare,
# browser, platform, or repository-write credentials.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  root-verification:
    name: Root verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Root preflight tests validate compatibility against the canonical app's
      # pinned Wrangler/workerd runtime, so install that dependency tree first.
      - run: npm ci --prefix cloudflare/thot-os-next
      # Check committed Worker bindings before any build can regenerate them.
      - name: Check generated Worker types
        run: |
          for worker in instagram-scheduler reddit-scheduler telegram-bridge vault-bridge thot-os-public-links thot-os-public-media thot-os-public-links-control; do
            (
              cd "cloudflare/$worker"
              ../thot-os-next/node_modules/.bin/wrangler types --check worker-configuration.d.ts
            )
          done
          (
            cd cloudflare/thot-os-next
            node_modules/.bin/wrangler types --env-interface CloudflareEnv --check cloudflare-env.d.ts
          )
      - run: npm run lint
      - run: npm test
      # Static only: validates the committed deployment registry against Wrangler
      # configuration without authenticating to or changing Cloudflare.
      - run: npm run deployment:preflight -- --environment staging --all
      # The root Next config belongs to the retired SQLite runtime. Compile
      # the canonical application with its installed, pinned compiler instead.
      - run: npm --prefix cloudflare/thot-os-next run lint
      - run: npm run build
      - run: git diff --check

  cloudflare-application:
    name: Cloudflare application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare/thot-os-next
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/thot-os-next/package-lock.json
      - run: npm ci --prefix ../..
      - run: npm ci
      # Includes local D1 migration replay and creator-isolation coverage.
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx opennextjs-cloudflare build

  instagram-scheduler:
    name: Worker - Instagram scheduler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/instagram-scheduler
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/instagram-scheduler/package-lock.json
      - run: npm ci
      - run: npm run check

  reddit-scheduler:
    name: Worker - Reddit scheduler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/reddit-scheduler
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/reddit-scheduler/package-lock.json
      - run: npm ci
      - run: npm run check

  telegram-bridge:
    name: Worker - Telegram bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/telegram-bridge
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/telegram-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  vault-bridge:
    name: Worker - Vault bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/vault-bridge
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/vault-bridge/package-lock.json
      - run: npm ci
      - run: npm run check


  public-workers:
    name: Worker - ${{ matrix.worker }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - thot-os-public-links
          - thot-os-public-media
          - thot-os-public-links-control
          - thot-os-public-contact
          - thot-os-adult-gateway
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/thot-os-next/package-lock.json
      # Public Workers share the canonical app's pinned compiler/runtime.
      - run: npm ci --prefix cloudflare/thot-os-next
      # Contact/adult gateway currently maintain hand-written Env contracts;
      # their check scripts compile those contracts rather than Wrangler output.
      - name: Check generated Worker bindings
        if: matrix.worker != 'thot-os-public-contact' && matrix.worker != 'thot-os-adult-gateway'
        working-directory: cloudflare/${{ matrix.worker }}
        run: ../thot-os-next/node_modules/.bin/wrangler types --check worker-configuration.d.ts
      - run: npm --prefix cloudflare/${{ matrix.worker }} run check
      - run: npm --prefix cloudflare/${{ matrix.worker }} test
      - run: git diff --check
